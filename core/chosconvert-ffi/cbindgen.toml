language = "C"
include_guard = "CHOSCONVERT_CORE_H"
autogen_warning = "/* Generated by cbindgen from core/chosconvert-ffi. Do not edit by hand. */"
include_version = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
cpp_compat = true

[export]
include = []

[export.rename]
"CcEventCallback" = "cc_event_callback"

[fn]
args = "auto"

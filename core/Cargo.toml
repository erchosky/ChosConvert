[workspace]
resolver = "3"
members = ["chosconvert-core", "chosconvert-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-ChosConvert-TBD"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
libwebp-sys = { version = "0.14.4", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
